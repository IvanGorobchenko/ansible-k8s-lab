---
- name: Базовая настройка всех машин
  hosts: all
  become: true
  tasks:
    - name: Обновить кэш пакетов apt
      apt:
        update_cache: true
        cache_valid_time: 3600
    - name: Установить базовые утилиты
      apt:
        name:
          - curl
          - vim
          - git
          - htop
          - net-tools
        state: present
