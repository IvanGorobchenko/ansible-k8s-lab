---
- name: Подготовка узлов Kubernetes
  hosts: k8s
  become: true
  tasks:
    - name: Загрузить модули ядра сейчас
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Сделать загрузку модулей постоянной
      copy:
        dest: /etc/modules-load.d/k8s.conf
        content: "overlay\nbr_netfilter\n"
        mode: "0644"

    - name: Настроить sysctl для Kubernetes
      copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward                 = 1
        mode: "0644"

    - name: Применить sysctl
      command: sysctl --system

    - name: Сгенерировать дефолтный конфиг containerd
      shell: containerd config default > /etc/containerd/config.toml

    - name: Включить SystemdCgroup в containerd
      replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'
      notify: Перезапустить containerd

    - name: Перезапустить containerd
      systemd:
        name: containerd
        state: restarted
        enabled: true

    - name: Установить зависимости для репозитория Kubernetes
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gpg
        state: present
        update_cache: true

    - name: Скачать GPG-ключ Kubernetes
      get_url:
        url: https://pkgs.k8s.io/core:/stable:/v1.31/deb/Release.key
        dest: /etc/apt/keyrings/kubernetes.asc
        mode: "0644"

    - name: Добавить репозиторий Kubernetes
      copy:
        dest: /etc/apt/sources.list.d/kubernetes.list
        content: "deb [signed-by=/etc/apt/keyrings/kubernetes.asc] https://pkgs.k8s.io/core:/stable:/v1.31/deb/ /\n"
        mode: "0644"

    - name: Установить kubelet, kubeadm, kubectl
      apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
          - conntrack
          - socat
        state: present
        update_cache: true

    - name: Зафикссировать версии
      dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

    - name: Выключить swap сейчас
      command: swapoff -a
      when: ansible_swaptotal_mb > 0

    - name: Убрать swap из fstab навсегда
      replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '# \1'

  handlers:
    - name: Перезапустить containerd
      systemd:
        name: containerd
        state: restarted
        enabled: true
